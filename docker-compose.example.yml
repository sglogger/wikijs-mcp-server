# Beispiel-Setup für den Wiki.js MCP Server.
#
# Fall A — Wiki.js läuft bereits (der Normalfall):
#   Nur den Service "wikijs-mcp" verwenden und WIKIJS_BASE_URL in der .env
#   auf die bestehende Instanz zeigen lassen (z. B. https://wiki.example.com).
#
# Fall B — komplettes Setup inkl. Wiki.js:
#   Die auskommentierten Services "wiki" und "db" unten mit aktivieren.
#
# Verwendung:
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env   # und Werte anpassen
#   docker compose up -d

services:
  wikijs-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "3123:3123"
    environment:
      # Adresse, unter der DIESER Container die Wiki.js-API erreicht.
      WIKIJS_BASE_URL: ${WIKIJS_BASE_URL}
      # Öffentliche Browser-URL für die zitierten Links. Setzen, wenn
      # WIKIJS_BASE_URL eine interne Adresse wie http://wiki:3000 ist.
      WIKIJS_URL: ${WIKIJS_URL:-}
      WIKIJS_API_KEY: ${WIKIJS_API_KEY}
      WIKIJS_DEFAULT_LOCALE: ${WIKIJS_DEFAULT_LOCALE:-en}
      WIKIJS_READ_ONLY: ${WIKIJS_READ_ONLY:-false}
      # Optional: alle Tools hart auf einen Wiki-Bereich beschränken.
      WIKIJS_PATH_PREFIX: ${WIKIJS_PATH_PREFIX:-}
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3123"
      # Empfohlen: Endpunkt mit einem Token schützen. Mattermost schickt das
      # Token als Custom Header "Authorization: Bearer <token>" mit.
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3123/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

